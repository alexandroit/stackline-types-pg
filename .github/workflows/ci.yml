name: Release gates

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: types-pg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['16', '18', '22', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify clean source install
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-install.log
          if grep -Eiq 'npm[[:space:]]+(warn|error)|deprecated' /tmp/npm-install.log; then
            echo 'npm install emitted a warning, error, or deprecation notice'
            exit 1
          fi
          npm ls --all
          npm audit --audit-level=low
      - run: npm run verify
      - name: Strict package lint
        if: matrix.node == '26'
        run: npx --yes publint@0.3.24 . --strict

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
